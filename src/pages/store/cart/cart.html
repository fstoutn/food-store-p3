<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Food Store - Carrito</title>
	<link rel="stylesheet" href="../../../style.css">
</head>
<body class="store-page">
	<header class="navbar">
		<div class="navbar-left">
			<a href="../home/home.html" class="logo">Food Store</a>
		</div>
		<div class="navbar-actions">
			<a href="./cart.html" class="cart-button" aria-label="Carrito">
				🛒 <span id="cart-badge" class="cart-badge">0</span>
			</a>
			<span id="user-name" class="cart-user-name"></span>
		</div>
	</header>

	<main class="cart-page">
		<div class="cart-heading">
			<div>
				<button id="back-to-store" class="back-button" type="button">← Seguir comprando</button>
				<h1>Tu carrito</h1>
				<p id="cart-item-count">0 productos</p>
			</div>
			<button id="clear-cart" class="btn-danger-outline" type="button">Vaciar carrito</button>
		</div>

		<p id="cart-message" class="form-error cart-message"></p>

		<div class="cart-layout">
			<section id="cart-items" class="cart-items" aria-live="polite"></section>

			<aside class="cart-summary">
				<h2>Resumen del pedido</h2>
				<div class="summary-row">
					<span>Subtotal</span>
					<strong id="cart-subtotal">$0.00</strong>
				</div>
				<div class="summary-row">
					<span>Envío</span>
					<strong id="cart-shipping">$500.00</strong>
				</div>
				<div class="summary-total">
					<span>Total</span>
					<strong id="cart-total">$0.00</strong>
				</div>
				<button id="checkout-button" class="btn-primary" type="button">
					Proceder al pago
				</button>
			</aside>
		</div>
	</main>

	<div id="checkout-modal" class="modal-backdrop" hidden>
		<section class="checkout-modal" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
			<div class="modal-header">
				<h2 id="checkout-title">Confirmar pedido</h2>
				<button id="close-checkout" class="modal-close" type="button" aria-label="Cerrar">×</button>
			</div>

			<form id="checkout-form">
				<div class="form-group">
					<label for="phone">Teléfono *</label>
					<input id="phone" name="phone" type="tel" required>
				</div>
				<div class="form-group">
					<label for="address">Dirección de entrega *</label>
					<input id="address" name="address" type="text" required>
				</div>
				<div class="form-group">
					<label for="payment-method">Método de pago *</label>
					<select id="payment-method" name="payment-method" required>
						<option value="">Seleccionar método</option>
						<option value="efectivo">Efectivo</option>
						<option value="tarjeta">Tarjeta</option>
						<option value="transferencia">Transferencia</option>
					</select>
				</div>
				<div class="form-group">
					<label for="notes">Notas adicionales</label>
					<textarea id="notes" name="notes" rows="3"></textarea>
				</div>
				<p id="checkout-message" class="form-error"></p>
				<button class="btn-primary" type="submit">Confirmar pedido</button>
			</form>
		</section>
	</div>

	<script type="module" src="./cart.ts"></script>
</body>
</html>
